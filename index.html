<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barkada Gram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Minimal Top Instagram Nav Bar -->
        <header class="insta-nav">
            <h1 class="logo-text">Barkadagram</h1>
            <p class="sub-text">Shared moments live feed</p>
        </header>

        <!-- Clean Input Area -->
        <div class="upload-section">
            <input type="text" id="name-input" placeholder="Write your name..." autocomplete="off">
            <div class="file-select-row">
                <input type="file" id="photo-input" accept="image/*">
                <button id="upload-btn">Share Post</button>
            </div>
        </div>

        <!-- Vertical Single Post Column Feed -->
        <div id="photo-gallery" class="instagram-feed"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
