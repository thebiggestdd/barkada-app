<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barkada Daily Photo Drops</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Barkada Shared Memories</h1>
            <p>Drop your daily photos here live! 🚀</p>
        </header>

        <div class="upload-section">
            <input type="text" id="name-input" placeholder="Type your name here..." autocomplete="off">
            
            <div class="file-select-row">
                <input type="file" id="photo-input" accept="image/*">
                <button id="upload-btn">Upload</button>
            </div>
        </div>

        <div id="photo-gallery" class="gallery-grid"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
