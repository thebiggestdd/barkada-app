<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Our Daily Drops</h1>
        <p>A simple space to share our day-to-day photos ✨</p>
    </header>

    <main>
        <section class="upload-container">
            <input type="file" id="photo-input" accept="image/*">
            <button id="upload-btn">Upload</button>
        </section>

        <section class="gallery-container" id="photo-gallery">
            <!-- Photos will populate beautifully right here -->
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
