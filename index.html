<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Shared Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Barkada Photo Share</h1>
        <p>A simple space for our shared memories.</p>
    </header>

    <!-- Upload Section -->
    <main>
        <section class="upload-container">
            <input type="file" id="photo-input" accept="image/*">
            <button id="upload-btn">Upload Photo</button>
        </section>

        <!-- Photo Grid Feed -->
        <section class="gallery-container" id="photo-gallery">
            <!-- Uploaded photos will dynamically load here via JavaScript -->
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
